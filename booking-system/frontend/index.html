<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>Booking System</h2>
    </nav>

    <div class="container">

        <h1>Welcome</h1>

        <p class="subtitle">
            Select a service
        </p>

        <div class="cards">

            <div class="card food-card"
                 onclick="window.location.href='food.html'">

                <div class="icon">🍔</div>

                <h2>Food Ordering</h2>

                <p>
                    Order your favorite food
                </p>

                <button>
                    Order Food
                </button>

            </div>


            <div class="card movie-card"
                 onclick="window.location.href='movie.html'">

                <div class="icon">🎬</div>

                <h2>Movie Booking</h2>

                <p>
                    Book movie tickets
                </p>

                <button>
                    Book Movie
                </button>

            </div>


            <div class="card bus-card"
                 onclick="window.location.href='bus.html'">

                <div class="icon">🚌</div>

                <h2>Bus Booking</h2>

                <p>
                    Book your bus ticket
                </p>

                <button>
                    Book Bus
                </button>

            </div>

        </div>

    </div>

</body>
</html>
